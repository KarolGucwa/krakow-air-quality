name: CI

# Every push / pull request: lint, unit tests of the extractor and a full dbt build
# (seeds, models, data tests, unit tests) on a small synthetic dataset. No API calls.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_PATH: warehouse/ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests analysis dashboard scripts

      - name: Extractor unit tests
        run: pytest

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Synthetic raw data (2018-2021, spans the 2019 ban)
        run: aq generate-sample --start 2018-01-01 --end 2021-12-31

      - name: dbt build (models + data tests + unit tests)
        run: >
          dbt build --project-dir dbt --profiles-dir dbt
          --vars '{raw_path: data/sample/raw, analysis_first_season_start_year: 2018}'

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            logs/dbt.log
          if-no-files-found: ignore

  spark-dialect:
    # Same dbt project on local Apache Spark: checks every spark__/databricks__ macro and
    # the Spark SQL of all models without a Databricks workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          pip install -e .
          pip install -r requirements-spark.txt

      - name: Synthetic raw data and Spark tables
        run: |
          aq generate-sample --start 2018-01-01 --end 2021-12-31
          python scripts/register_spark_raw.py --raw-dir data/sample/raw

      - name: dbt build on Spark
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt build --project-dir dbt --profiles-dir dbt --target spark_local --exclude "test_type:unit" \
            --vars '{analysis_first_season_start_year: 2018}'

      - name: dbt unit tests on Spark
        # after the build: unit-test fixtures read column types from the built relations
        run: dbt test --project-dir dbt --profiles-dir dbt --target spark_local --select "test_type:unit"
