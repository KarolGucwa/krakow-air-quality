[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aq-pipeline"
version = "0.1.0"
description = "Kraków air quality ELT pipeline: GIOŚ + Open-Meteo -> Parquet -> dbt (DuckDB / Databricks)"
authors = [{ name = "Karol Gucwa" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "duckdb>=1.1",
]

[project.scripts]
aq = "aq_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
